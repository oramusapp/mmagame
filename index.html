<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0f14">
  <meta name="description" content="FIGHT CAMP – Twój plan treningowy MMA jako gra: zadania, dziennik treningu, rywal tygodnia, XP i pasy.">
  <title>Fight Camp</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="hud"></header>
  <main id="view"></main>
  <nav id="tabs">
    <button data-act="tab" data-tab="arena"><span>🏟️</span>Arena</button>
    <button data-act="tab" data-tab="tasks"><span>✅</span>Zadania</button>
    <button data-act="tab" data-tab="journal"><span>📓</span>Dziennik</button>
    <button data-act="tab" data-tab="timer"><span>⏱️</span>Zegar</button>
    <button data-act="tab" data-tab="profile"><span>🥋</span>Zawodnik</button>
  </nav>
  <div id="modal-root"></div>
  <div id="toasts" aria-live="polite"></div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <script src="app.js"></script>
</body>
</html>
